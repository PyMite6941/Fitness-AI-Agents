name: Build Watch Firmware

# Free cloud build for the FitnessAI Watch (ESP32-C3) firmware.
# Compiles in the cloud (no local toolchain needed) and uploads the flashable
# binaries as an artifact. Download them from the run's "Artifacts" section and
# flash with esptool / arduino-cli upload. Run from the Actions tab, or it runs
# automatically when the firmware changes.

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'watch/firmware/**'
      - '.github/workflows/watch-firmware.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `path` is under watch/firmware/; `name` must be artifact-safe (no '/'),
          # and GitHub Actions expressions have no replace() to derive one from it.
          - path: fitness_watch
            name: fitness_watch          # the product firmware
          - path: watch_diag
            name: watch_diag             # hardware component diagnostic
          - path: screen_measure
            name: screen_measure         # display size / driver identification
          - path: i2c_scan/general_scan
            name: i2c_general_scan       # definitive I2C finder (all GPIO pairs)
    steps:
      - uses: actions/checkout@v4

      - name: Set up arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core + libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10   # pinned to match the local flash toolchain
          # ArduinoJson is pinned to 7.x: net.cpp uses the v7 `JsonDocument` API,
          # which does not exist in v6 (that needed StaticJsonDocument<N>).
          # BLE* and HTTPClient/WebServer/DNSServer come from the esp32 core.
          arduino-cli lib install \
            "U8g2" \
            "SparkFun MAX3010x Pulse and Proximity Sensor Library" \
            "Adafruit MPU6050" \
            "Adafruit Unified Sensor" \
            "Adafruit BusIO" \
            "ArduinoJson@7.4.3" \
            "LiquidCrystal I2C"   # DISPLAY_TYPE=DISPLAY_LCD1602 needs this

      - name: Compile (export flashable binaries)
        run: |
          # CDCOnBoot=cdc routes the app's Serial over the native USB so a single
          # USB cable gives both flashing and serial debug output.
          # PartitionScheme=huge_app gives a 3 MB app partition — the BLE + HTTPS
          # stacks push the firmware well past the default 1.3 MB "no_ota" space.
          arduino-cli compile \
            --fqbn esp32:esp32:esp32c3:CDCOnBoot=cdc,PartitionScheme=huge_app \
            --export-binaries \
            --warnings all \
            watch/firmware/${{ matrix.path }}

      - name: Collect binaries
        run: |
          mkdir -p out
          # the build subdir name encodes the FQBN + options, so glob it
          cp watch/firmware/${{ matrix.path }}/build/*/*.bin out/
          echo "--- flashable binaries (${{ matrix.name }}) ---"
          ls -la out

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitness-watch-${{ matrix.name }}-esp32c3
          path: out/**
          if-no-files-found: error
