name: visual
version: 1
author: FitnessAI Watch

# Screenshot-driven verification. Asserts nothing itself — it captures the OLED
# at each step so the frames can be inspected.
#
# WHY THIS EXISTS: Wokwi's ESP32-C3 does not deliver this firmware's Serial
# output to the CLI's monitor (see sim/README.md > Serial), so the scenarios
# that assert with `wait-serial` cannot run. Everything those tests drive —
# buttons, the battery pot, the IMU — still works, and the display is the
# firmware's real output surface, so the same code paths are verified by
# looking at the screen instead of the log.
#
# Screen order is {HOME, HR, STEPS, SYNC, STATUS} and a tap on A steps
# BACKWARDS through it: HOME -> STATUS -> SYNC -> STEPS -> HR -> HOME.
steps:
  # ── Boot: 2 s loading bar, then the home screen ───────────────────────────
  - delay: 4s
  - take-screenshot: { part-id: oled, save-to: shots/01-home.png }

  # ── Tap A: HOME -> STATUS (shows battDetail() from the M7 monitor) ────────
  - set-control: { part-id: btnA, name: pressed, value: 1 }
  - delay: 150ms
  - set-control: { part-id: btnA, name: pressed, value: 0 }
  - delay: 500ms
  - take-screenshot: { part-id: oled, save-to: shots/02-status.png }

  # ── Healthy cell: pot 635 ~= 4.10 V. BATT_INTERVAL_MS is 10 s. ────────────
  - set-control: { part-id: batt, name: value, value: 635 }
  - delay: 12s
  - take-screenshot: { part-id: oled, save-to: shots/03-batt-good.png }

  # ── External power: pot 682 ~= 4.40 V, above the 4.25 V USB guess ─────────
  - set-control: { part-id: batt, name: value, value: 682 }
  - delay: 12s
  - take-screenshot: { part-id: oled, save-to: shots/04-batt-usb.png }

  # ── Critical: pot 450 ~= 2.90 V, well under the 3.4 V shed threshold ──────
  - set-control: { part-id: batt, name: value, value: 450 }
  - delay: 12s
  - take-screenshot: { part-id: oled, save-to: shots/05-batt-crit.png }

  # ── Tap A: STATUS -> SYNC ─────────────────────────────────────────────────
  - set-control: { part-id: btnA, name: pressed, value: 1 }
  - delay: 150ms
  - set-control: { part-id: btnA, name: pressed, value: 0 }
  - delay: 500ms
  - take-screenshot: { part-id: oled, save-to: shots/06-sync.png }

  # ── Tap A: SYNC -> STEPS, then walk ───────────────────────────────────────
  - set-control: { part-id: btnA, name: pressed, value: 1 }
  - delay: 150ms
  - set-control: { part-id: btnA, name: pressed, value: 0 }
  - delay: 500ms
  - take-screenshot: { part-id: oled, save-to: shots/07-steps-before.png }

  # Rest at 1 g on Z first: the part starts at 0,0,0, a magnitude of zero, which
  # reads as 9.8 m/s2 of deviation and sits permanently over the step threshold.
  - set-control: { part-id: imu, name: accelZ, value: 1 }
  - delay: 1s
  - set-control: { part-id: imu, name: accelZ, value: 1.6 }
  - delay: 100ms
  - set-control: { part-id: imu, name: accelZ, value: 1 }
  - delay: 400ms
  - set-control: { part-id: imu, name: accelZ, value: 1.6 }
  - delay: 100ms
  - set-control: { part-id: imu, name: accelZ, value: 1 }
  - delay: 400ms
  - set-control: { part-id: imu, name: accelZ, value: 1.6 }
  - delay: 100ms
  - set-control: { part-id: imu, name: accelZ, value: 1 }
  - delay: 600ms
  - take-screenshot: { part-id: oled, save-to: shots/08-steps-after.png }

  # ── Tap A: STEPS -> HR (the synthetic PPG has been running since 3 s) ─────
  - set-control: { part-id: btnA, name: pressed, value: 1 }
  - delay: 150ms
  - set-control: { part-id: btnA, name: pressed, value: 0 }
  - delay: 500ms
  - take-screenshot: { part-id: oled, save-to: shots/09-hr.png }

  # ── Hold A: straight back to HOME (must NOT land one screen further on) ───
  - set-control: { part-id: btnA, name: pressed, value: 1 }
  - delay: 900ms
  - set-control: { part-id: btnA, name: pressed, value: 0 }
  - delay: 500ms
  - take-screenshot: { part-id: oled, save-to: shots/10-home-after-hold.png }

  # ── Double-tap B: display mute. The panel must go blank. ──────────────────
  - set-control: { part-id: btnB, name: pressed, value: 1 }
  - delay: 120ms
  - set-control: { part-id: btnB, name: pressed, value: 0 }
  - delay: 130ms
  - set-control: { part-id: btnB, name: pressed, value: 1 }
  - delay: 120ms
  - set-control: { part-id: btnB, name: pressed, value: 0 }
  - delay: 1s
  - take-screenshot: { part-id: oled, save-to: shots/11-muted.png }

  # ── Double-tap B again: display back on ───────────────────────────────────
  - set-control: { part-id: btnB, name: pressed, value: 1 }
  - delay: 120ms
  - set-control: { part-id: btnB, name: pressed, value: 0 }
  - delay: 130ms
  - set-control: { part-id: btnB, name: pressed, value: 1 }
  - delay: 120ms
  - set-control: { part-id: btnB, name: pressed, value: 0 }
  - delay: 1s
  - take-screenshot: { part-id: oled, save-to: shots/12-unmuted.png }
